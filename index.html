<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Generator · SoundFaith</title>
    <meta name="description" content="Type a link. Copy the QR code. Paste it anywhere." />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <script>
      if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
    </script>
  </head>
  <body class="min-h-screen bg-stone-50 text-stone-900 antialiased transition-colors selection:bg-accent selection:text-black dark:bg-stone-950 dark:text-stone-100">
    <div class="mx-auto flex min-h-screen w-full max-w-md flex-col px-6">
      <header class="flex items-center justify-between pt-8">
        <div class="flex items-center gap-3">
          <img src="/logo.svg" alt="" class="h-10 w-10" />
          <div class="leading-tight">
            <h1 class="text-base font-semibold tracking-tight">QR Generator</h1>
            <p class="text-xs text-stone-500">by SoundFaith</p>
          </div>
        </div>
        <button id="theme" aria-label="Toggle theme" class="grid h-9 w-9 place-items-center rounded-full text-stone-500 transition hover:bg-stone-200/70 hover:text-stone-900 dark:hover:bg-stone-800 dark:hover:text-stone-100">
          <svg class="hidden h-[18px] w-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="h-[18px] w-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </header>

      <main class="flex flex-1 flex-col justify-center gap-14 py-16">
        <textarea
          id="text"
          rows="1"
          autofocus
          spellcheck="false"
          placeholder="Paste a link or text"
          class="w-full resize-none overflow-hidden border-b border-stone-200 bg-transparent pb-4 text-lg leading-snug text-stone-900 placeholder:text-stone-400 focus:border-accent focus:outline-none dark:border-stone-800 dark:text-stone-100 dark:placeholder:text-stone-600"
        ></textarea>

        <div id="card" class="mx-auto w-full max-w-sm rounded-3xl bg-white p-5 shadow-2xl shadow-black/10 ring-1 ring-black/5 transition-opacity duration-500 dark:shadow-black/60">
          <canvas id="canvas" class="block aspect-square h-auto w-full"></canvas>
        </div>

        <div id="actions" class="pointer-events-none flex flex-col gap-10 opacity-0 transition-opacity duration-500">
          <div class="flex items-center justify-center gap-6">
            <button id="copy" class="rounded-full bg-accent px-7 py-3 text-sm font-semibold text-black transition hover:brightness-110 active:scale-95">Copy image</button>
            <button id="png" class="text-sm text-stone-500 transition hover:text-stone-900 dark:hover:text-stone-100">PNG</button>
            <button id="svg" class="text-sm text-stone-500 transition hover:text-stone-900 dark:hover:text-stone-100">SVG</button>
          </div>

          <div class="flex flex-col gap-6 text-sm">
            <div class="flex items-center justify-between">
              <span class="text-stone-500">Color</span>
              <div id="swatches" class="flex items-center gap-3"></div>
            </div>

            <div class="flex items-center justify-between">
              <span class="text-stone-500">Logo</span>
              <div class="flex items-center gap-4">
                <img id="thumb" alt="" class="hidden h-6 w-6 rounded object-contain" />
                <button id="remove" class="hidden text-stone-500 transition hover:text-stone-900 dark:hover:text-stone-100">Remove</button>
                <button id="upload" class="text-stone-900 transition hover:text-accent dark:text-stone-100 dark:hover:text-accent">Upload</button>
                <button id="toggle" role="switch" aria-checked="false" aria-label="Show logo" class="relative hidden h-6 w-10 rounded-full bg-stone-300 transition-colors aria-checked:bg-accent dark:bg-stone-700">
                  <span class="absolute left-0.5 top-0.5 h-5 w-5 rounded-full bg-white shadow transition-transform" id="knob"></span>
                </button>
              </div>
              <input id="file" type="file" accept="image/*" class="hidden" />
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
